<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Chatbot Lab</title>
  <style>
    :root {
      --bg: #0f1115; --panel: #171a21; --border: #262b36;
      --text: #e6e9ef; --muted: #9aa4b2; --accent: #6ea8fe;
      --user: #2b3140; --bot: #1d2430;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg); color: var(--text); height: 100vh; display: flex;
    }
    /* Sidebar: live view of the config — the teaching aid. */
    aside {
      width: 320px; flex-shrink: 0; border-right: 1px solid var(--border);
      background: var(--panel); padding: 20px; overflow-y: auto;
    }
    aside h1 { font-size: 18px; margin: 0 0 4px; }
    aside .tag { color: var(--muted); font-size: 12px; margin-bottom: 20px; }
    .field { margin-bottom: 18px; }
    .field .label { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin-bottom: 6px; }
    .field .value { font-size: 14px; word-break: break-word; }
    .pill { display: inline-block; background: var(--user); border: 1px solid var(--border);
            border-radius: 999px; padding: 3px 10px; font-size: 13px; }
    .prompt-box { background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
                  padding: 10px; font-size: 13px; color: var(--muted); white-space: pre-wrap; max-height: 160px; overflow-y: auto; }
    .tool { background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; margin-bottom: 6px; }
    .tool .name { font-size: 13px; font-weight: 600; }
    .tool .desc { font-size: 12px; color: var(--muted); }
    .tool .srv { font-size: 11px; color: var(--accent); }
    .empty { font-size: 13px; color: var(--muted); }
    select { width: 100%; background: var(--bg); color: var(--text); border: 1px solid var(--border);
             border-radius: 8px; padding: 8px 10px; font-size: 13px; font-family: inherit; }
    .hint { font-size: 12px; color: var(--muted); margin-top: 6px; }
    .err { color: #ff8f8f; font-size: 13px; margin-top: 4px; }

    /* Chat area */
    main { flex: 1; display: flex; flex-direction: column; }
    #messages { flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 14px; }
    .msg { max-width: 720px; padding: 12px 16px; border-radius: 12px; line-height: 1.5; white-space: pre-wrap; }
    .msg.user { align-self: flex-end; background: var(--user); }
    .msg.bot { align-self: flex-start; background: var(--bot); border: 1px solid var(--border); }
    .msg.error { align-self: flex-start; background: #3a1d1d; border: 1px solid #5c2b2b; color: #ffc9c9; }

    /* "Under the hood" trace panel — shows the raw JSON exchanged with the model. */
    .under-hood { align-self: flex-start; max-width: 720px; width: 100%;
                  background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 4px 12px; }
    .under-hood > summary { cursor: pointer; font-size: 13px; color: var(--accent); padding: 6px 0; list-style: none; user-select: none; }
    .under-hood > summary::-webkit-details-marker { display: none; }
    .under-hood > summary::before { content: "▸ "; }
    .under-hood[open] > summary::before { content: "▾ "; }
    .uh-note { font-size: 12px; color: var(--muted); border-left: 2px solid var(--accent); padding: 4px 10px; margin: 4px 0 10px; }
    .uh-step { border-top: 1px solid var(--border); padding: 8px 0; }
    .uh-h { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin-bottom: 6px; }
    details.uh-json { margin: 4px 0; }
    details.uh-json > summary { cursor: pointer; font-size: 13px; color: var(--text); padding: 3px 0; }
    .uh-json pre { background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 10px;
                   font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 12px; line-height: 1.45;
                   color: #cdd6e4; overflow-x: auto; white-space: pre; max-height: 340px; overflow-y: auto; margin: 4px 0; }
    .composer { border-top: 1px solid var(--border); padding: 16px 24px; display: flex; gap: 10px; }
    #input { flex: 1; resize: none; background: var(--panel); color: var(--text);
             border: 1px solid var(--border); border-radius: 10px; padding: 12px; font-size: 15px; font-family: inherit; }
    button { background: var(--accent); color: #0b1220; border: 0; border-radius: 10px;
             padding: 0 20px; font-size: 15px; font-weight: 600; cursor: pointer; }
    button:disabled { opacity: .5; cursor: default; }
  </style>
</head>
<body>
  <aside>
    <h1>🧪 Chatbot Lab</h1>
    <div class="tag">Everything below comes from <code>config.yaml</code></div>

    <div class="field">
      <div class="label">Provider</div>
      <div class="value"><span class="pill" id="provider">…</span></div>
    </div>
    <div class="field">
      <div class="label">Model</div>
      <select id="model-select"><option>…</option></select>
      <div class="hint" id="model-hint">Switching applies to your next message — no restart needed.</div>
    </div>
    <div class="field">
      <div class="label">System Prompt</div>
      <div class="prompt-box" id="system-prompt">…</div>
    </div>
    <div class="field">
      <div class="label">MCP Tools</div>
      <div id="tools"><div class="empty">Loading…</div></div>
      <div id="mcp-errors"></div>
    </div>
  </aside>

  <main>
    <div id="messages"></div>
    <div class="composer">
      <textarea id="input" rows="1" placeholder="Say something to the chatbot…"></textarea>
      <button id="send">Send</button>
    </div>
  </main>

  <script>
    const messagesEl = document.getElementById("messages");
    const inputEl = document.getElementById("input");
    const sendBtn = document.getElementById("send");
    const modelSelect = document.getElementById("model-select");
    const history = []; // {role, content} pairs sent to the backend
    let models = [];    // the configured provider/model pairs from /api/config

    function addMessage(role, text) {
      const div = document.createElement("div");
      div.className = "msg " + role;
      div.textContent = text;
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
      return div;
    }

    // Fill the model dropdown, one <optgroup> per provider so it's obvious which
    // backend each model runs on.
    function renderModels(cfg) {
      models = cfg.models || [];
      modelSelect.innerHTML = "";
      if (!models.length) {
        modelSelect.innerHTML = '<option value="">(none configured)</option>';
        modelSelect.disabled = true;
        return;
      }
      let group = null;
      for (const m of models) {
        if (!group || group.label !== m.provider) {
          group = document.createElement("optgroup");
          group.label = m.provider;
          modelSelect.appendChild(group);
        }
        const opt = document.createElement("option");
        opt.value = m.id;
        opt.textContent = m.model + (m.needs_key ? "  — no API key" : "");
        group.appendChild(opt);
      }
      modelSelect.value = cfg.active_model_id;
      syncProviderPill();
    }

    // Keep the Provider pill and the hint in step with the dropdown.
    function syncProviderPill() {
      const m = models.find(x => x.id === modelSelect.value);
      if (!m) return;
      document.getElementById("provider").textContent = m.provider;
      document.getElementById("model-hint").textContent = m.needs_key
        ? `No API key set for ${m.provider} — add ${m.provider}.api_key in config.yaml.`
        : "Switching applies to your next message — no restart needed.";
    }

    async function loadConfig() {
      try {
        const cfg = await (await fetch("/api/config")).json();
        document.getElementById("provider").textContent = cfg.provider;
        renderModels(cfg);
        document.getElementById("system-prompt").textContent = cfg.system_prompt || "(none)";

        const toolsEl = document.getElementById("tools");
        toolsEl.innerHTML = "";
        if (!cfg.tools.length) {
          toolsEl.innerHTML = '<div class="empty">No MCP tools connected. Enable one in config.yaml.</div>';
        } else {
          for (const t of cfg.tools) {
            const el = document.createElement("div");
            el.className = "tool";
            el.innerHTML = `<div class="name">${t.name}</div>
                            <div class="srv">via ${t.server}</div>
                            <div class="desc">${t.description || ""}</div>`;
            toolsEl.appendChild(el);
          }
        }
        const errEl = document.getElementById("mcp-errors");
        errEl.innerHTML = cfg.mcp_errors.map(e => `<div class="err">⚠ ${e}</div>`).join("");
      } catch (e) {
        document.getElementById("provider").textContent = "config error";
      }
    }

    function jsonSection(label, obj, open) {
      const d = document.createElement("details");
      d.className = "uh-json";
      if (open) d.open = true;
      const s = document.createElement("summary");
      s.textContent = label;
      const pre = document.createElement("pre");
      pre.textContent = JSON.stringify(obj, null, 2);
      d.appendChild(s);
      d.appendChild(pre);
      return d;
    }

    // Build the collapsible "Under the hood" panel from a turn's trace.
    function renderTrace(trace, modelId) {
      const details = document.createElement("details");
      details.className = "under-hood";
      const summary = document.createElement("summary");
      const n = trace.length;
      summary.textContent = `Under the hood — ${n} request${n === 1 ? "" : "s"} to ${modelId || "the model"}`;
      details.appendChild(summary);

      const note = document.createElement("div");
      note.className = "uh-note";
      note.textContent = "This is the exact JSON payload we send to the model, and what it sends back. " +
        "Your API key travels in an HTTP header, not in this body, so it never appears here.";
      details.appendChild(note);

      for (const st of trace) {
        const step = document.createElement("div");
        step.className = "uh-step";
        const h = document.createElement("div");
        h.className = "uh-h";
        h.textContent = `Step ${st.step} · ${st.kind}`;
        step.appendChild(h);
        step.appendChild(jsonSection("→ Request  (conversation history sent to the model)", st.request, true));
        if (st.tool_calls && st.tool_calls.length) {
          step.appendChild(jsonSection("🛠 Tool calls & results  (fed back on the next request)", st.tool_calls, false));
        }
        if (st.response) {
          step.appendChild(jsonSection("← Response  (what the model returned)", st.response, false));
        }
        details.appendChild(step);
      }
      return details;
    }

    async function send() {
      const text = inputEl.value.trim();
      if (!text) return;
      inputEl.value = "";
      addMessage("user", text);
      history.push({ role: "user", content: text });

      sendBtn.disabled = true;
      const thinking = addMessage("bot", "…");
      try {
        const res = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ messages: history, model_id: modelSelect.value || null }),
        });
        const data = await res.json();
        if (!res.ok) {
          thinking.remove();
          const errEl = addMessage("error", "Error: " + (data.error || res.statusText));
          // Show whatever we managed to send before the error — useful for debugging.
          if (data.trace && data.trace.length) {
            errEl.insertAdjacentElement("afterend", renderTrace(data.trace, modelSelect.value));
          }
        } else {
          thinking.textContent = data.reply;
          history.push({ role: "assistant", content: data.reply });
          if (data.trace && data.trace.length) {
            thinking.insertAdjacentElement("afterend", renderTrace(data.trace, data.model));
          }
        }
        messagesEl.scrollTop = messagesEl.scrollHeight;
      } catch (e) {
        thinking.remove();
        addMessage("error", "Network error: " + e.message);
      } finally {
        sendBtn.disabled = false;
        inputEl.focus();
      }
    }

    modelSelect.addEventListener("change", syncProviderPill);
    sendBtn.addEventListener("click", send);
    inputEl.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
    });

    loadConfig();
    inputEl.focus();
  </script>
</body>
</html>
